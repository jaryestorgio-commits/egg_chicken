<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Checkout | Egg &amp; Chicken</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/checkout.css"></head>
<body data-root="../">
    <div id="navbar"></div>
    <main id="main">
        <div class="wrap">
            <div class="page-title">
                <h1 style="font-size:2.6rem">Checkout</h1>
            </div><form id="form" class="layout" novalidate>
                <div class="card">
            <h3>Customer information</h3>
            <label for="name">Full name</label>
            <input id="name" name="name" required autocomplete="name">
            <div class="fgrid"><div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required></div>
                <div><label for="phone">Phone</label>
                    <input id="phone" name="phone" type="tel" required></div></div>
            <h3 style="margin-top:28px">Delivery address</h3>
            <label for="addr">Address</label>
            <input id="addr" name="address" required>
            <div class="fgrid"><div>
                <label for="brgy">Barangay</label>
                <input id="brgy" name="barangay" required></div>
                <div><label for="city">Municipality/City</label>
                    <input id="city" name="city" required></div><div>
                        <label for="prov">Province</label>
                        <input id="prov" name="province" required></div><div>
                            <label for="zip">Postal code</label>
                            <input id="zip" name="zip" required></div></div>
                                <h3 style="margin-top:28px">Delivery option</h3>
                                <label class="opt">
                                    <input type="radio" name="delivery" value="standard" checked> Standard Delivery</label>
                                    <label class="opt">
                                        <input type="radio" name="delivery" value="pickup"> Farm Pickup (free)</label>
                                    <section class="payment-methods" aria-labelledby="payment-title">
                                        <h3 id="payment-title" style="margin-top:28px">Payment Methods</h3>
                                        <p class="payment-hint">Choose how you would like to pay for your order.</p>
                                        <div class="payment-options">
                                            <label class="payment-card">
                                                <input type="radio" name="payment" value="cod" checked>
                                                <span class="payment-icon payment-icon-cod" aria-hidden="true">₱</span>
                                                <span class="payment-copy"><strong>Cash on Delivery</strong><small>Pay in cash when your order arrives.</small></span>
                                                <span class="payment-radio" aria-hidden="true"></span>
                                            </label>
                                            <label class="payment-card">
                                                <input type="radio" name="payment" value="gcash">
                                                <span class="payment-icon payment-icon-gcash" aria-hidden="true">G</span>
                                                <span class="payment-copy"><strong>GCash <small class="payment-via">via Xendit</small></strong><small>Pay securely using your GCash account.</small></span>
                                                <span class="payment-radio" aria-hidden="true"></span>
                                            </label>
                                            <label class="payment-card">
                                                <input type="radio" name="payment" value="card">
                                                <span class="payment-icon payment-icon-card" aria-hidden="true">
                                                    <svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18M7 15h4"></path></svg>
                                                </span>
                                                <span class="payment-copy"><strong>Credit/Debit Card <small class="payment-via">via Xendit</small></strong><small>Card details are entered securely on Xendit.</small></span>
                                                <span class="payment-radio" aria-hidden="true"></span>
                                            </label>
                                        </div>
                                    </section></div>
                                <aside class="card sum"><h3>Order summary</h3>
                                    <div id="items" style="display:block"></div><div>
                                        <span>Subtotal</span><span id="csub"></span></div><div><span>Delivery</span>
                                            <span id="cfee"></span></div>
                                            <div class="total"><span>Total</span><span id="ctotal"></span></div>
                             <p class="error" id="err" role="alert"></p>
                             <button class="btn btn-primary" id="place" style="width:100%;margin-top:10px">Place Order</button></aside></form></div></main>
                             <div id="footer"></div><div id="toast" role="status" aria-live="polite"></div>
                             <script src="../js/main.js"></script><script src="../js/cart.js"></script><script src="../js/checkout.js"></script><script>document.addEventListener("shell:ready",initCheckout)

                             </script>
                             </body>
                             </html>
