<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Deliveries | Egg &amp; Chicken Admin</title>
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/admin.css">
</head>
<body data-admin-page="deliveries">
	<div class="admin-shell">
		<aside class="admin-sidebar" id="admin-sidebar"><a class="admin-brand" href="dashboard.html"><span class="admin-brand-mark" aria-hidden="true">E</span><span>Egg &amp; Chicken<small>Merchant admin</small></span></a><nav class="admin-nav" aria-label="Admin navigation"></nav><div class="admin-sidebar-footer"><a href="account.html">Settings</a><a href="messages.html">Help &amp; support</a><button class="admin-logout" type="button" data-admin-logout>Sign out</button><a class="store-link" href="../index.html">View storefront</a></div></aside>
		<button class="admin-drawer-backdrop" type="button" aria-label="Close navigation" data-admin-menu-close></button>
		<main class="admin-main">
			<header class="admin-topbar"><div class="admin-heading"><button class="admin-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="admin-sidebar" data-admin-menu-toggle>☰</button><div><p class="eyebrow">Fulfillment</p><h1>Deliveries</h1><p class="admin-subtitle">Track orders through packing, dispatch, and delivery.</p></div></div><div class="admin-actions"><button class="btn btn-outline btn-sm" id="admin-refresh" type="button">Refresh</button></div></header>
			<div class="admin-alert" id="admin-error" role="alert" hidden></div><div class="admin-toast" id="admin-toast" role="status" aria-live="polite"></div>
			<section class="admin-panel"><div class="admin-toolbar"><input id="order-search" type="search" placeholder="Search order, customer, or email" aria-label="Search deliveries"><select id="order-filter" aria-label="Filter delivery status"><option value="all">All fulfillment statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="processing">Processing</option><option value="shipped">Ready for dispatch</option><option value="delivered">Delivered</option></select></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Fulfillment</th><th>Update</th></tr></thead><tbody id="order-rows"><tr><td colspan="8" class="admin-empty">Loading deliveries…</td></tr></tbody></table></div><nav class="admin-pagination" id="order-pagination" aria-label="Delivery pages"></nav><p class="admin-muted">Delivery personnel assignment is not available in the current system.</p></section>
		</main>
	</div>
	<dialog class="admin-dialog admin-detail-dialog" id="order-dialog"><div class="admin-dialog-content"><button type="button" class="admin-dialog-close" aria-label="Close order details" data-dialog-close>×</button><div id="order-detail-content"></div></div></dialog>
	<script src="../js/admin.js"></script>
</body>
</html>
