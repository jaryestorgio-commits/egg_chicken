<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Customers | Egg &amp; Chicken Admin</title>
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/admin.css">
</head>
<body data-admin-page="customers">
	<div class="admin-shell">
		<aside class="admin-sidebar" id="admin-sidebar"><a class="admin-brand" href="dashboard.html"><span class="admin-brand-mark" aria-hidden="true">E</span><span>Egg &amp; Chicken<small>Store administration</small></span></a><nav class="admin-nav" aria-label="Admin navigation"><a href="dashboard.html">Overview</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="orders.html">Orders</a><a class="active" aria-current="page" href="customers.html">Customers</a><a href="reports.html">Reports &amp; analytics</a><a href="messages.html">Messages &amp; support</a></nav><div class="admin-sidebar-footer"><a href="account.html">Settings</a><button class="admin-logout" type="button" data-admin-logout>Sign out</button><a class="store-link" href="../index.html">View storefront</a></div></aside>
		<button class="admin-drawer-backdrop" type="button" aria-label="Close navigation" data-admin-menu-close></button>
		<main class="admin-main">
			<header class="admin-topbar"><div class="admin-heading"><button class="admin-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="admin-sidebar" data-admin-menu-toggle>☰</button><div><p class="eyebrow">People</p><h1>Customers</h1><p class="admin-subtitle">Customer accounts and order history.</p></div></div><div class="admin-actions"><span class="admin-greeting" data-admin-greeting></span><button class="btn btn-outline btn-sm" id="admin-refresh" type="button">Refresh</button></div></header>
			<div class="admin-alert" id="admin-error" role="alert" hidden></div><div class="admin-toast" id="admin-toast" role="status" aria-live="polite"></div>
			<section class="admin-panel"><div class="admin-toolbar"><input id="customer-search" type="search" placeholder="Search name or email" aria-label="Search customers"><select id="customer-role-filter" aria-label="Filter by account role"><option value="all">All accounts</option><option value="customer">Customers</option><option value="admin">Administrators</option></select></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Customer</th><th>Email</th><th>Role</th><th>Joined</th><th>History</th></tr></thead><tbody id="customer-rows"><tr><td colspan="5" class="admin-empty">Loading customers…</td></tr></tbody></table></div><nav class="admin-pagination" id="customer-pagination" aria-label="Customer pages"></nav></section>
		</main>
	</div>
	<dialog class="admin-dialog admin-detail-dialog" id="customer-dialog"><div class="admin-dialog-content"><button type="button" class="admin-dialog-close" aria-label="Close customer history" data-dialog-close>×</button><div id="customer-detail-content"></div></div></dialog>
	<script src="../js/admin.js"></script>
</body>
</html>
